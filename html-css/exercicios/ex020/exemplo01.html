<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-Classes</title>
    <style>
        div {
            display: inline-block;
            background-color: rgb(88, 88, 88);
            border: 1px solid black;
            text-align: center;            
            height: 200px;
            width: 200px;
            width: 200px;
            
        }
        div:hover {
            background-color: darkorange;
        }

         div > p {
            display: none;
        }
        div:hover > p {
            display: block;
            color: white;
            background-color: rgb(30, 255, 0);
            width: 300px;
            text-align: center;
        }
        div:hover {
            color: red;
        }
    </style>
</head>
<body>
    <div id="d1">01 Olá
        <p>MUNDO!</p>
    </div>
    <div id="d2">02</div>
    <div id="d3">03</div>
</body>
</html>
